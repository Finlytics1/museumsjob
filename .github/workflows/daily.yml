name: Daily museumsjob search

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 08:00 Danish summer time / 07:00 winter time
  workflow_dispatch:       # "Run workflow" button for a manual run

permissions:
  contents: write          # to save seen.json and the report back to the repo

concurrency:
  group: daily-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search and email results
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: python museumsjob.py --email --no-open

      - name: Save seen jobs and today's report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json museumsjob.html
          git diff --cached --quiet || git commit -m "Daily search $(date +%F)"
          git push
